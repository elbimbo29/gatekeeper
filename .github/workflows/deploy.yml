# Name of the workflow (shows up in GitHub Actions tab)
name: Deploy Gatekeeper

# Trigger: run this workflow whenever code is pushed to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  # Define a job called "build"
  build:
    # Runner environment: GitHub provides an Ubuntu VM to run the job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code into the runner
      - name: Checkout
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx (advanced builder for multi-platform images)
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to GitHub Container Registry (GHCR)
      # Uses GitHub's built-in token to authenticate
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # Your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }}  # Auto-generated token for authentication

      # Step 4: Build and push Docker image
      # Takes your Dockerfile, builds the image, and uploads it to GHCR
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .                             # Build context = current repo
          push: true                             # Push image after build
          tags: ghcr.io/${{ github.repository }}/gatekeeper:latest
          # Image will be stored at: ghcr.io/<username>/<repo>/gatekeeper:latest
