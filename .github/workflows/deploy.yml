# This workflow automates building and publishing your Docker image to GHCR
name: Deploy Gatekeeper

# Trigger: run whenever code is pushed to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # GitHub provides an Ubuntu runner to execute the job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code
      - name: Checkout
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx (advanced builder)
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to GitHub Container Registry (GHCR)
      # Uses GitHub’s built-in token for authentication
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # Your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }}  # Auto-generated token

      # Step 4: Build and push Docker image
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .                             # Build context = current repo
          push: true                             # Push image after build
          tags: ghcr.io/${{ github.repository }}/gatekeeper:latest
          # Image will be stored at: ghcr.io/<username>/<repo>/gatekeeper:latest
